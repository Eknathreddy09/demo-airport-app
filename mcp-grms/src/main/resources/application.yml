server:
  port: ${PORT:8083}

spring:
  application:
    name: mcp-grms
  ai:
    mcp:
      server:
        name: "grms-mcp-server"
        version: "1.0.0"
        protocol: STREAMABLE
  rabbitmq:
    listener:
      simple:
        missing-queues-fatal: false

airport:
  events:
    exchange: airport.events

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    rabbit:
      enabled: false
